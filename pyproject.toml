[project]
name = "geo-api"
version = "0.1.0"
description = "A bounded geospatial file measurement API"
authors = [
    { name = "marsh15", email = "santoshkumarsp2004@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.2",
    "fastkml>=1.4.0",
    "geographiclib>=2.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.8.0",
    "pyshp>=3.1.6",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geographiclib.*", "shapely.*"]
ignore_missing_imports = true
